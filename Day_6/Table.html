<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="/FullStack/Day_6/Table.html" method="post">
    <form action="/register" method="post">
        <label for="name">Name:</label>
        <br>
        <input type="text" id="name" name="name" required>
        <br>
        <label for="email">Email:</label>
        <br>
        <input type="email" id="email" name="email" required>
        <br>
        <label for="password">Password:</label>
        <br>
        <input type="password" id="password" name="password" required>
        <br>
        <label for="Number" >Number:</label>
        <br>
        <input type="number" id="number" name="number" required>
        <br>
        <br>
        <label for="Message">Message:</label>
        <br>
        <textarea id="Message" name="Message" rows="15" cols="40" min="20" max="200"
        placeholder="Enter your message here..."></textarea>
        <br>
        <br>
        <label for="department">Department:</label>
        <select id="department" name="department" required>
            <option value="CSE">Computer Science and Engineering</option>
            <option value="ECE">Electronics and Communication Engineering</option>
            <option value="EEE">Electrical and Electronics Engineering</option>
        </select>
        <br>
        <br>
        <input type="checkbox" id="id" name="checkbox" required/>
        <label for="checkbox">I agree to the terms and conditions</label>
        <br>
        <br>
        <button type="reset">🧹</button>
        <button type="submit">✅</button>
    </form>
</body>
</html>
